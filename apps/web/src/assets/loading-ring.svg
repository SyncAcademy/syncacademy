  <circle cx="60" cy="8" r="7" fill="#F79435" fill-opacity=".32" filter="url(#dot-glow)"/>
  <circle cx="60" cy="60" r="52" stroke="url(#loading-arc)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="90 327" transform="rotate(-90 60 60)"/>
  <circle cx="60" cy="8" r="6" fill="url(#loading-dot)" stroke="#FFF9EF" stroke-width="2"/>
