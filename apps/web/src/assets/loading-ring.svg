<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="loading-arc" x1="60" y1="8" x2="112" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC36B"/>
      <stop offset=".52" stop-color="#F79435"/>
      <stop offset="1" stop-color="#E87E24"/>
    </linearGradient>
    <radialGradient id="loading-dot" cx="0" cy="0" r="1" gradientTransform="matrix(0 8 -8 0 60 8)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4D8"/>
      <stop offset=".44" stop-color="#FFB34F"/>
      <stop offset="1" stop-color="#F28A2B"/>
    </radialGradient>
    <filter id="dot-glow" x="47" y="-5" width="26" height="26" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3"/>
