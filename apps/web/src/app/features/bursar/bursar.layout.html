<ion-app>
  <ion-split-pane contentId="bursar-main-content" when="(min-width: 992px)">
    <!-- Sidebar -->
    <ion-menu
      contentId="bursar-main-content"
      menuId="bursar-menu"
      type="overlay"
      [swipeGesture]="true"
    >
      <app-bursar-sidebar></app-bursar-sidebar>
    </ion-menu>

    <!-- Main Content Area -->
    <div class="ion-page bursar-page" id="bursar-main-content">
      <!-- Top Header -->
      <ion-header class="ion-no-border">
        <header class="bursar-header">
          <div class="bursar-header__left">
            <ion-menu-button menu="bursar-menu" class="mobile-menu-btn"></ion-menu-button>
            <div class="bursar-header__titles">
              <p class="bursar-header__breadcrumb">{{ pageBreadcrumb() }}</p>
              <h1 class="global-page-title">{{ pageTitle() }}</h1>
            </div>
          </div>

          <div class="bursar-header__right">
            <app-academic-year-selector viewer="bursar"></app-academic-year-selector>
            <app-notification-bell audience="bursar" />
          </div>
        </header>
      </ion-header>

      <!-- Scrollable Content -->
      <main #bursarContent class="bursar-content" role="main" (scroll)="onContentScroll($event)">
        <div class="bursar-content-inner">
          <app-portal-connection />
          @if (api.schoolId() && !api.data() && !api.error()) { <app-loading-skeleton /> }
          @else if (api.data()) { <router-outlet></router-outlet> }
        </div>
      </main>

      <button
        class="scroll-to-top"
        [class.show]="showScrollTop()"
        type="button"
        aria-label="Scroll to top"
        title="Back to top"
        (click)="scrollToTop()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5M6 11l6-6 6 6" />
        </svg>
      </button>
    </div>
  </ion-split-pane>
</ion-app>
