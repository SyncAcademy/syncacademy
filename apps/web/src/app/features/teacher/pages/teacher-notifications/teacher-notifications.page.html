<div class="teacher-notifications">
  <app-teacher-page-header
    title="Notifications"
    [description]="unreadCount() > 0 ? unreadCount() + ' unread notifications' : 'All caught up!'">
    <button *ngIf="unreadCount() > 0" type="button" class="action-btn" (click)="markAllRead()">
      Mark all as read
    </button>
  </app-teacher-page-header>

  <div *ngIf="loading()" class="skeleton-container" aria-busy="true">
    <div class="skeleton-notif" *ngFor="let i of [1,2,3,4]"></div>
  </div>

  <div *ngIf="!loading()" class="notif-list">
    <div class="notif-item" *ngFor="let n of notifications()"
         [class.notif-item--unread]="!n.read"
>
      <div class="notif-item__dot" *ngIf="!n.read"></div>
      <div class="notif-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="notif-item__body">
        <p class="notif-item__message">{{ n.message }}</p>
        <time class="notif-item__time">{{ n.createdAt | date:'MMM d, y \u2014 h:mm a' }}</time>
        <div class="portal-filters" style="margin-top:12px;margin-bottom:0">
          <a *ngIf="n.relatedAssignmentId" class="action-btn" [routerLink]="['/teacher', n.relatedAssignmentId, n.type === 'roster_issue_resolved' ? 'roster' : 'status']" (click)="markAsRead(n.id)">View assignment</a>
          <button *ngIf="!n.read" class="action-btn" (click)="markAsRead(n.id)">Mark as read</button>
        </div>
      </div>
    </div>

    <div *ngIf="notifications().length === 0" class="empty-state">
      <p>No notifications yet.</p>
    </div>
  </div>
</div>
