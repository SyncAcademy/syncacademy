<div class="teacher-profile">
  <app-teacher-page-header
    title="My Profile"
    description="View your account information.">
  </app-teacher-page-header>

  <div class="profile-card">
    <div class="profile-card__avatar">{{ teacher.fullName.slice(0, 2).toUpperCase() }}</div>
    <div class="profile-card__info">
      <h3 class="profile-card__name">{{ teacher.fullName }}</h3>
      <span class="profile-card__role">{{ teacher.role }}</span>
    </div>
  </div>

  <div class="details-card">
    <h4 class="details-card__title">Account Information</h4>
    <div class="details-row">
      <span class="details-row__label">Full Name</span>
      <span class="details-row__value">{{ teacher.fullName }}</span>
    </div>
    <div class="details-row">
      <span class="details-row__label">Email</span>
      <span class="details-row__value">{{ teacher.email }}</span>
    </div>
    <div class="details-row">
      <span class="details-row__label">School</span>
      <span class="details-row__value">{{ teacher.school }}</span>
    </div>
  </div>

  
</div>
