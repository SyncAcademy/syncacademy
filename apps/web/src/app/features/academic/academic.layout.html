<ion-app>
  <ion-split-pane contentId="academic-main-content" when="(min-width: 992px)">
    <!-- Sidebar -->
    <ion-menu
      contentId="academic-main-content"
      menuId="academic-menu"
      type="overlay"
      [swipeGesture]="true"
      (ionWillOpen)="menuOpen = true"
      (ionWillClose)="menuOpen = false"
    >
      <app-academic-sidebar></app-academic-sidebar>
    </ion-menu>

    <!-- Main Content Area -->
    <div class="ion-page academic-page" id="academic-main-content">
      <!-- Top Header -->
      <ion-header class="ion-no-border">
        <header class="academic-header">
          <div class="academic-header__left">
            <ion-menu-button
              menu="academic-menu"
              class="mobile-menu-btn"
              [class.menu-open]="menuOpen"
              [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'"
            >
              <svg class="mobile-menu-btn__icon" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="18" x2="20" y2="18"></line>
              </svg>
            </ion-menu-button>
            <div class="academic-header__titles">
              <p class="academic-header__breadcrumb">{{ pageBreadcrumb() }}</p>
              <h1 class="global-page-title">{{ pageTitle() }}</h1>
            </div>
          </div>

          <div class="academic-header__right">
            <app-academic-year-selector viewer="academic"></app-academic-year-selector>
            <app-notification-bell audience="academic" />
          </div>
        </header>
      </ion-header>

      <!-- Scrollable Content -->
      <main #academicContent class="academic-content" role="main" (scroll)="onContentScroll($event)">
        <div class="academic-content-inner">
          <app-portal-connection />
          @if(academicData.error()){<p class="portal-notice portal-notice--error" role="alert">{{ academicData.error() }} <button type="button" (click)="academicData.load()">Reload</button></p>}
          @if ((api.schoolId() && !api.data() && !api.error()) || (academicData.loading() && !academicData.hasData())) { <app-loading-skeleton /> }
          @else if (api.data()) { <router-outlet></router-outlet> }
        </div>
      </main>

      <button
        class="scroll-to-top"
        [class.show]="showScrollTop()"
        type="button"
        aria-label="Scroll to top"
        title="Back to top"
        (click)="scrollToTop()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5M6 11l6-6 6 6" />
        </svg>
      </button>
    </div>
  </ion-split-pane>
</ion-app>
