<nav class="sidebar">
  <div class="sidebar__top">
    <!-- Logo -->
    <div class="sidebar__logo">
      <!-- Inline SVG for the orange icon -->
      <div class="sidebar__logo-icon">
        <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/>
        </svg>
      </div>
      <span class="sidebar__logo-text">
        <span class="sidebar__logo-sync">Sync</span>
        <span class="sidebar__logo-academy">Academy</span>
      </span>
    </div>

    <!-- Campus Selector -->
    <button class="sidebar__campus-selector">
      <svg class="sidebar__campus-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 4h-4V2H9v2H5v18h14V4zM7 18H6v-2h1v2zm0-4H6v-2h1v2zm0-4H6V8h1v2zm4 8H9v-2h2v2zm0-4H9v-2h2v2zm0-4H9V8h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V8h2v2z"/>
      </svg>
      <span>{{ selectedCampus() }}</span>
      <svg class="sidebar__chevron" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
      </svg>
    </button>

    <!-- Navigation Sections -->
    <div class="sidebar__nav">
      <div class="sidebar__section" *ngFor="let section of navSections">
        <span class="sidebar__section-label">{{ section.label }}</span>
        <a
          *ngFor="let item of section.items"
          class="sidebar__nav-item"
          [routerLink]="item.route"
          routerLinkActive="sidebar__nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }">
          <span class="sidebar__nav-bullet"></span>
          {{ item.title }}
        </a>
      </div>
    </div>
  </div>

  <!-- Bottom: Settings + User -->
  <div class="sidebar__bottom">
    <a class="sidebar__settings" routerLink="/dashboard/settings" routerLinkActive="sidebar__nav-item--active">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.73 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
      Settings
    </a>
    <div class="sidebar__user">
      <div class="sidebar__user-avatar">
        <!-- Initials avatar -->
        AJ
      </div>
      <div class="sidebar__user-info">
        <span class="sidebar__user-name">Admin Juma</span>
        <span class="sidebar__user-role">Super Admin</span>
      </div>
    </div>
  </div>
</nav>
