<ion-app>
  <ion-split-pane contentId="main-content" when="(min-width: 992px)">
    <!-- Sidebar -->
    <ion-menu
      contentId="main-content"
      menuId="main-menu"
      type="overlay"
      [swipeGesture]="true"
    >
      <app-sidebar></app-sidebar>
    </ion-menu>

    <!-- Main Content Area -->
    <div class="ion-page dashboard-page" id="main-content">
      <!-- Top Unified Header -->
      <ion-header class="ion-no-border">
        <header class="dashboard-header">
          <div class="dashboard-header__left">
            <ion-menu-button class="mobile-menu-btn"></ion-menu-button>
            <h1 class="global-page-title">{{ pageTitle() }}</h1>
          </div>

          <div class="dashboard-header__right">
            <div class="dashboard-header__search">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" placeholder="Search system..." />
            </div>

            <button class="icon-btn">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
            </button>
          </div>
        </header>
      </ion-header>

      <!-- Scrollable Content -->
      <main class="dashboard-content" role="main">
        <div class="dashboard-content-inner">
          <ion-router-outlet></ion-router-outlet>
        </div>
      </main>
    </div>
  </ion-split-pane>
</ion-app>
