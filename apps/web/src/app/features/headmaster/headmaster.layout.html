<ion-app>
  <ion-split-pane contentId="head-main-content" when="(min-width: 992px)">
    <!-- Sidebar -->
    <ion-menu
      contentId="head-main-content"
      menuId="head-menu"
      type="overlay"
      [swipeGesture]="true"
    >
      <app-head-sidebar></app-head-sidebar>
    </ion-menu>

    <!-- Main Content Area -->
    <div class="ion-page head-page" id="head-main-content">
      <!-- Top Header -->
      <ion-header class="ion-no-border">
        <header class="head-header">
          <div class="head-header__left">
            <ion-menu-button menu="head-menu" class="mobile-menu-btn"></ion-menu-button>
            <div class="head-header__titles">
              <p class="head-header__breadcrumb">{{ pageBreadcrumb() }}</p>
              <h1 class="global-page-title">{{ pageTitle() }}</h1>
            </div>
          </div>

          <div class="head-header__right">
            <app-academic-year-selector viewer="head"></app-academic-year-selector>
            <app-notification-bell audience="head" />
          </div>
        </header>
      </ion-header>

      <!-- Scrollable Content -->
      <main #headContent class="head-content" role="main" (scroll)="onContentScroll($event)">
        <div class="head-content-inner">
          <app-portal-connection />
          @if ((api.schoolId() && !api.data() && !api.error()) || (academicData.loading() && !academicData.hasData())) { <app-loading-skeleton /> }
          @else { <router-outlet></router-outlet> }
        </div>
      </main>

      <button
        class="scroll-to-top"
        [class.show]="showScrollTop()"
        type="button"
        aria-label="Scroll to top"
        title="Back to top"
        (click)="scrollToTop()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5M6 11l6-6 6 6" />
        </svg>
      </button>
    </div>
  </ion-split-pane>
</ion-app>
