<div class="preloader-overlay" *ngIf="showPreloader" [class.fade-out]="fadePreloader" role="status" aria-label="Loading SyncAcademy">
  <div class="preloader-content">
    <div class="loader-stage" aria-hidden="true">
      <svg class="loading-track" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52"/>
      </svg>
      <img class="loading-ring" src="/assets/loading-ring.svg" alt="">
      <img class="graduation-cap" src="/assets/graduation-cap.svg" alt="">
    </div>
    <h1 class="brand-name"><span class="text-black">Sync</span><span class="text-orange">Academy</span></h1>
    <p class="brand-tagline">A smarter way to manage your school</p>
    <p class="entry-slow" *ngIf="entrySlow">Taking longer than usual. Check your connection if this continues.</p>
  </div>
</div>
<div class="network-progress" *ngIf="network.visible() && !showPreloader" aria-label="Loading updated information"><span></span></div>
<router-outlet></router-outlet>
