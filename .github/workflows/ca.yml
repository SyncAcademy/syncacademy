name: SyncAcademy CA

on:
  push:
    branches:
      - main
      - testing
  pull_request:
    branches:
      - main
      - testing
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  architecture-governance:
    name: Continuous Architecture (CA) & Security Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Continuous Architecture & Governance
        run: npm run verify:architecture

      - name: Run dependency security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  codeql-analysis:
    name: Code Analysis (CA) / CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
