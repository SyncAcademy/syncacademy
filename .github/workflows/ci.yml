name: SyncAcademy CI

on:
  push:
    branches:
      - main
      - testing
  pull_request:
    branches:
      - main
      - testing
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, Test & Verify
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: syncacademy_auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3101
      APP_ORIGIN: http://localhost:4200
      API_URL: http://localhost:3101
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syncacademy_auth_test
      REALTIME_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syncacademy_auth_test
      SESSION_SECRET: syncacademy-ci-testing-session-secret-32-chars-long
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SMTP_HOST: localhost
      MAIL_FROM: noreply@syncacademy.test
      CONTACT_NOTIFICATION_EMAIL: ""
      EMAIL_PROVIDER: mock
      COMMUNICATION_MOCK_DISPATCH: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run lint --workspace=apps/web

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=apps/api

      - name: Build API backend
        run: npm run build --workspace=apps/api

      - name: Build Web application
        run: npm run build --workspace=apps/web

      - name: Run Backend in-memory unit tests
        run: npm run test

      - name: Apply Prisma database migrations
        run: npm run migrate --workspace=apps/api

      - name: Run Backend database integration tests
        run: |
          node --test apps/api/test/auth.test.cjs
          node --test apps/api/test/mobile-security-isolation.test.cjs
          node --test apps/api/test/parent-mobile.test.cjs

      - name: Verify Architecture and Design Governance
        run: npm run verify:architecture

      - name: Run Mobile Architecture Checks
        run: npm run test:mobile-architecture --workspace=apps/web

      - name: Run Mobile Cryptographic Vault & Offline Tests
        run: npm run test:crypto-vault --workspace=apps/web

      - name: Run Frontend portal workflow verification scripts
        run: |
          npm run test:registrar-workflow --workspace=apps/web
          npm run test:academic-workflow --workspace=apps/web
          npm run test:academic-years --workspace=apps/web
          npm run test:bursar-workflow --workspace=apps/web
          npm run test:head-oversight --workspace=apps/web
          npm run test:class-teacher --workspace=apps/web
          npm run test:school-setup --workspace=apps/web
          npm run test:super-admin --workspace=apps/web
          npm run test:platform-admin-auth --workspace=apps/web

      - name: Run Frontend state & concurrency verification scripts
        run: |
          node apps/web/scripts/check-concurrent-drafts.mjs
          node apps/web/scripts/check-school-sync.mjs
          node apps/web/scripts/check-student-result-summary.mjs
          node apps/web/scripts/check-teaching-responsibilities.mjs

  android-build:
    name: Android Build (Parent & Teacher Flavors)
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java JDK (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform and Build-Tools
        run: |
          sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build Web application
        run: npm run build --workspace=apps/web

      - name: Sync Capacitor Android
        run: |
          cd apps/web
          npx cap sync android

      - name: Assemble Parent Debug & Release APKs and Release Bundle
        run: |
          cd apps/web/android
          ./gradlew assembleParentDebug assembleParentRelease bundleParentRelease --stacktrace

      - name: Assemble Teacher Debug & Release APKs and Release Bundle
        run: |
          cd apps/web/android
          ./gradlew assembleTeacherDebug assembleTeacherRelease bundleTeacherRelease --stacktrace

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            apps/web/android/app/build/outputs/apk/parent/**/*.apk
            apps/web/android/app/build/outputs/apk/teacher/**/*.apk
            apps/web/android/app/build/outputs/bundle/parentRelease/**/*.aab
            apps/web/android/app/build/outputs/bundle/teacherRelease/**/*.aab

  ios-build:
    name: iOS Build Pipeline Specification
    runs-on: macos-14
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install dependencies
        run: npm ci

      - name: Build Web application
        run: npm run build --workspace=apps/web

      - name: Sync Capacitor iOS
        run: |
          cd apps/web
          npx cap sync ios

      - name: CocoaPods Dependency Resolution
        run: |
          cd apps/web/ios/App
          pod install

      - name: Compile iOS Archive (Unsigned Specification)
        run: |
          cd apps/web/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
