server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 32k;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/json application/javascript text/css;
  resolver 127.0.0.11 valid=5s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  location ~ ^/api/v1/schools/[^/]+/registry/imports/preview$ {
    client_max_body_size 8m;
    set $api_backend api:3000;
    proxy_pass http://$api_backend$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location ~ ^/api/v1/schools/[^/]+/parent-announcements/[^/]+/media$ {
    client_max_body_size 5m;
    set $api_backend api:3000;
    proxy_pass http://$api_backend$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location /api/ {
    set $api_backend api:3000;
    proxy_pass http://$api_backend$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location /socket.io/ {
    set $api_backend api:3000;
    proxy_pass http://$api_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 70s;
  }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
